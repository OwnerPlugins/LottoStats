name: PEP8 Aggressive Check and Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pep8-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Pinned to the Python line Enigma2 boxes actually run (pre-3.12).
      # Python 3.12 (PEP 701) relaxed f-string grammar to allow arbitrary
      # expressions - including literal newlines - inside {}. autopep8's
      # own aggressive line-wrapping considers that a valid rewrite for a
      # long f-string line, and a compile-check running on 3.12+ agrees.
      # But that same rewrite is a hard SyntaxError on the Enigma2
      # runtime, so checking on a newer Python here would silently pass
      # code that crashes on the actual target device.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install autopep8 pycodestyle

      - name: Fix indentation (replace tabs with spaces)
        run: |
          find . -name "*.py" -exec sed -i 's/\t/    /g' {} +

      - name: Run autopep8 (aggressive)
        run: |
          autopep8 . --in-place --recursive --aggressive --aggressive

      - name: Verify autopep8 output still compiles
        run: |
          if ! python -m py_compile $(find . -name "*.py" -not -path "./.git/*"); then
            echo "::error::autopep8 produced a file that fails to compile. Discarding its changes so nothing broken gets committed."
            git checkout -- .
            git clean -fd
            exit 1
          fi

      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Pull latest changes
        run: |
          git pull origin main --no-rebase || echo "No remote changes to pull"

      - name: Commit and push if changes exist
        run: |
          git add .
          git diff --cached --quiet || git commit -m "Apply auto PEP8 aggressive fixes"
          git push origin main || echo "Push failed (e.g. due to race condition)"
